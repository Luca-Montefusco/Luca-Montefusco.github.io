<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luca Montefusco – Portfolio</title>
    <meta name="description" content="[DESCRIZIONE BREVE DEL SITO PER GOOGLE]" />

    <!-- Anteprima quando il link viene condiviso (Open Graph) -->
    <meta property="og:title" content="Luca Montefusco – Portfolio" />
    <meta property="og:description" content="[DESCRIZIONE BREVE DEL SITO]" />
    <meta property="og:image" content="/images/og-image.svg" />
    <meta property="og:type" content="website" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <!--
      Evita il "flash" del tema sbagliato: il tema viene applicato
      prima che React carichi la pagina.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = saved || (prefersDark ? 'dark' : 'light');
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
